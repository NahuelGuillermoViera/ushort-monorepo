<section class="generationContainer">
  <p class="title">URLs cortas para <span>grandes ideas</span></p>
  <form [formGroup]="form" (ngSubmit)="submit()">
    @if (badFormat()) {
      <div class="warn">
        <span class="note">
          <img src="/warn.svg" alt="warn">
          Cuidado!
        </span>
        <span class="info">
          El link debe contener http://* o https://*
        </span>
      </div>
    }
    <div class="form">
      <input type="text" formControlName="longUrl" placeholder="https://example.com" />
      <button class="generate" type="submit" >
        Acortar
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-arrow-right w-4 h-4 ml-2"
        >
          <path d="M5 12h14"></path>
          <path d="m12 5 7 7-7 7"></path>
        </svg>
      </button>
    </div>
  </form>
  <app-generated-content
      [linkResponse]="linkResponse()"
      [url]="url()"/>
</section>
